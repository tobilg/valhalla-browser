name: Release SDK and documentation
on:
  push:
    tags:
      - 'v*'
  # Manual runs verify and upload candidates but never publish or deploy.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valhalla-browser-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Validate tag and package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.js validate "$RELEASE_TAG"
  verify:
    needs: validate
    uses: ./.github/workflows/browser-proof.yml
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release
          path: build/package
      - id: registry
        run: node scripts/release.js published
      - name: Publish verified tarball with npm OIDC
        if: steps.registry.outputs.published != 'true'
        env:
          SDK_TARBALL: build/package/${{ needs.verify.outputs.tarball }}
        run: pnpm dlx npm@12.0.2 publish "$SDK_TARBALL" --access public --provenance --tag latest
  deploy-documentation:
    needs: [verify, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation
          path: packages/documentation/dist
      - name: Deploy matching documentation to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          pnpm --filter @tobilg/valhalla-browser-documentation exec wrangler pages deploy dist --project-name valhalla-browser-api --branch main
