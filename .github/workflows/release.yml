name: Release SDK, documentation and demo
on:
  push:
    tags:
      - 'v*'
  # Manual runs verify and upload candidates but never publish or deploy.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valhalla-browser-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate tag and package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.js validate "$RELEASE_TAG"
      - name: Require the deployed demo manifest URL
        if: github.event_name == 'push'
        env:
          VITE_DEMO_MANIFEST_URL: ${{ vars.VITE_DEMO_MANIFEST_URL }}
        run: |
          node --input-type=module <<'JS'
          const value = process.env.VITE_DEMO_MANIFEST_URL?.trim();
          let url;
          try { url = new URL(value); } catch {}
          if (!url || url.protocol !== 'https:' || url.username || url.password) {
            console.error('Set the repository Actions variable VITE_DEMO_MANIFEST_URL to the public HTTPS manifest URL for the Liechtenstein 2015 R2 dataset.');
            process.exit(1);
          }
          JS
  verify:
    needs: validate
    # The reusable workflow runs builds and suites in parallel. Its final
    # source-build-and-proof gate requires every job, including each browser.
    uses: ./.github/workflows/browser-proof.yml
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          name: sdk-release
          path: build/package
      - id: registry
        run: node scripts/release.js published
      - name: Publish verified tarball with npm OIDC
        if: steps.registry.outputs.published != 'true'
        env:
          SDK_TARBALL: build/package/${{ needs.verify.outputs.tarball }}
        run: pnpm dlx npm@12.0.2 publish "$SDK_TARBALL" --access public --provenance --tag latest
  deploy-documentation:
    needs: [verify, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: documentation
          path: packages/documentation/dist
      - name: Deploy matching documentation to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          pnpm --filter @tobilg/valhalla-browser-documentation exec wrangler pages deploy dist --project-name valhalla-browser-api --branch main
  deploy-demo:
    needs: [verify, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: demo
          path: packages/demo/dist
      - name: Deploy matching demo to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Reuse pinned Wrangler, but resolve configuration/output from the demo.
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          pnpm --filter @tobilg/valhalla-browser-documentation exec wrangler pages deploy dist --cwd ../demo --project-name valhalla-browser --branch main
